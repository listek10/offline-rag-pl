<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>offline-rag-pl</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>offline-rag-pl</h1>
    <div id="health" class="health">sprawdzam stan usług…</div>
  </header>

  <form id="ask-form" autocomplete="off">
    <div class="row">
      <input id="question" type="text" maxlength="500" required
             placeholder="Które państwa tworzą arktyczny kwartet NATO?">
      <button id="submit" type="submit">Zapytaj</button>
    </div>
    <div class="row toggles">
      <label><input id="gate" type="checkbox" checked> bramka trafności</label>
      <label><input id="verify" type="checkbox" checked> weryfikacja ugruntowania</label>
      <label>top_k <input id="top_k" type="number" min="1" value="5"></label>
      <span id="config-note" class="muted"></span>
    </div>
  </form>

  <!-- Etap 2: przełącznik korpusu + wgrywanie PDF-u ad hoc.
       Opcje selecta NIE mają wpisanych wartości: nazwy korpusów ustawia app.js z /api/health,
       żeby nie istniały dwa opisy jednej prawdy (zmiana `corpus.DEFAULT` w Pythonie musiałaby
       być pamiętana też tutaj — a nie byłaby). -->
  <section id="corpus-panel">
    <label>korpus
      <select id="corpus">
        <option id="corpus-base">korpus zmierzony</option>
        <option id="corpus-upload" disabled>dokument ad hoc (brak — wgraj PDF)</option>
      </select>
    </label>
    <input id="pdf" type="file" accept="application/pdf">
    <button id="upload-btn" type="button">wgraj PDF</button>
    <button id="upload-clear" type="button" hidden>usuń dokument demo</button>
    <span id="upload-msg" class="muted"></span>
    <p id="corpus-warning" class="warning" hidden></p>
  </section>

  <main>
    <section id="answer-panel">
      <h2>Odpowiedź</h2>
      <div id="blocked" class="blocked" hidden></div>
      <div id="answer" class="answer"></div>
      <details id="rejected-box" hidden>
        <summary>Odrzucona odpowiedź (nie została opublikowana)</summary>
        <div id="rejected" class="rejected"></div>
      </details>
      <ul id="verdicts" class="verdicts"></ul>
    </section>

    <aside id="diag">
      <h2>Przebieg</h2>
      <ol id="stages" class="stages"></ol>
      <h2>Źródła</h2>
      <div id="sources" class="sources"></div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
